# The web workspace's test container.
#
#   docker compose -f docker-compose.test.yml run --rm test
#
# This is the sanctioned way to build and typecheck this repository. Nothing is
# installed, built or run on the host — and here that rule buys something
# concrete beyond toolchain parity: **`npm install` writes tens of thousands of
# files and native binaries into node_modules**, and a host install leaves
# Linux-vs-macOS artefacts that the dev stack then mounts over, or doesn't.
# Keeping installs inside a container keeps the two from ever meeting.
#
# The failure this repository actually suffers from is a *silent* one, and no
# container prevents it: Connect-ES serialises only the fields in the schema it
# was built with, so a stale `@mosaic-media/sdui` drops a field on the wire, the
# call returns 200, and the server sees nil. If a new contract field appears not
# to arrive, check the installed version before suspecting the code. A green run
# here does not speak to that.
#
# For a shell in the same environment:
#
#   docker compose -f docker-compose.test.yml run --rm test bash
name: mosaic-web-test

services:
  test:
    # The full image, not -slim, and the reason is git: check-versions.mjs
    # shells out to `git tag`, and a slim image ships no git. That used to be
    # silent — the script caught the failure and reported "no tags yet —
    # nothing to check against", exit 0, so the check passed by never running,
    # the precise failure it was written to prevent. It now tells a repository
    # with no tags apart from a git that cannot run and fails on the second, so
    # a slim image would fail loudly rather than pass. Still the full image:
    # failing loudly is the fallback, not the plan.
    #
    # 22 matches the Shell's service in the Platform's docker-compose.dev.yml,
    # so a developer does not change Node between running the app and testing
    # it. Note that .github/workflows/verify.yml pins 20 — if the two ever
    # disagree about a build, CI's number is the one that decides a push.
    image: node:22-bookworm
    working_dir: /src/web
    environment:
      # git refuses a bind-mounted repository owned by a different uid than the
      # one running it — "dubious ownership", exit non-zero. check-versions
      # used to swallow that exactly as it swallowed a missing git; it now
      # fails on it, which is right but is still a broken run, so the config
      # stays. Set through the environment rather than a Dockerfile so this
      # repository needs no image of its own.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    volumes:
      - .:/src/web
      # node_modules are volumes rather than part of the bind mount, for the
      # reason in the header: an npm install is the worst possible shape for a
      # cross-OS mount, and the container's Linux binaries must not collide
      # with a host-side install.
      - mosaic-web-npm:/root/.npm
      - mosaic-web-node-root:/src/web/node_modules
      - mosaic-web-node-shell:/src/web/packages/shell/node_modules
      - mosaic-web-node-sdui-react:/src/web/packages/sdui-react/node_modules
      - mosaic-web-node-storybook:/src/web/packages/storybook/node_modules
    # The order .github/workflows/verify.yml runs it in, plus the typechecks.
    # The `git rev-parse` was what turned a broken git into a loud failure here
    # rather than a quiet pass inside check-versions; check-versions now does
    # that itself, so this is redundancy — kept because it costs a millisecond
    # and guards the whole command rather than one script.
    command:
      - bash
      - -eu
      - -o
      - pipefail
      - -c
      - |
        git rev-parse --git-dir > /dev/null
        node scripts/check-versions.mjs
        npm install --no-fund --no-audit
        npm run build --workspaces --if-present
        npm run typecheck --workspaces --if-present
        # After the build, because it imports what the build produced: the
        # runtime's declared vocabulary measured against the contract's
        # conformance fixture. A green build says a client compiles; this says
        # whether it implements what it claims to (ADR 0083, ADR 0084).
        node scripts/check-vocabulary.mjs
        # The contract's conformance corpus, run against this client. The same
        # goldens the Go side runs — two implementations, one set of expected
        # answers, and any disagreement is a named failing case rather than a
        # screen that behaves differently on one platform (ADR 0094).
        node scripts/check-conformance.mjs
        # The art-light colour maths, also after the build because it imports
        # what the build produced. This is the only code here that *computes* a
        # colour, and a wrong transform still renders — plausibly, which is the
        # worst of the options. Pinned against the published OKLab coordinates
        # of the sRGB primaries rather than only against itself.
        node scripts/check-artlight.mjs

  # `mosaic-shell`, the Go binary that serves the built Shell, is gated
  # separately because it needs a toolchain the Node image does not carry:
  #
  #   docker compose -f docker-compose.test.yml run --rm shell-binary
  #
  # It is a second service rather than a second stage in the one above because
  # the two are independent — this gate needs no npm install, and `test` needs
  # no Go — and running them together would make the slower of them the price
  # of the faster. The `architecture` repository splits `test` and `pdfs` the
  # same way and for the same reason.
  #
  # Note that it does NOT build the bundle first. The Go module compiles
  # against a committed-empty `webassets/`, and the handler's tests supply
  # their own asset trees, so this gate says whether the *server* is correct.
  # Whether a real bundle got embedded is `scripts/build-shell-binary.sh`'s
  # job, and the binary refuses to start when it did not.
  shell-binary:
    image: golang:1.25-bookworm
    working_dir: /src/web/mosaic-shell
    volumes:
      - .:/src/web
      # Caches in volumes rather than on the bind mount, matching the Platform
      # repository: Go writes thousands of small files and doing that across
      # the host boundary turns a warm run from seconds into minutes.
      - mosaic-web-gomod:/go/pkg/mod
      - mosaic-web-gobuild:/root/.cache/go-build
    command:
      - bash
      - -eu
      - -o
      - pipefail
      - -c
      - |
        gofmt -l . > /tmp/unformatted
        if [ -s /tmp/unformatted ]; then
          echo "These files are not gofmt-clean:" >&2
          cat /tmp/unformatted >&2
          exit 1
        fi
        go vet ./...
        go build ./...
        go test ./...

volumes:
  mosaic-web-npm:
  mosaic-web-gomod:
  mosaic-web-gobuild:
  mosaic-web-node-root:
  mosaic-web-node-shell:
  mosaic-web-node-sdui-react:
  mosaic-web-node-storybook:
